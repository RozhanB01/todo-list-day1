name: moonberry

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: moonberry
      POSTGRES_PASSWORD: moonberry_local_dev
      POSTGRES_DB: moonberry
    volumes:
      - moonberry-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moonberry -d moonberry']
      interval: 5s
      timeout: 4s
      retries: 12
    labels:
      base44.project: 'Moonberry'
      base44.kind: 'infra'

  api:
    build:
      context: ./apps/api
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npx prisma generate
        npx prisma db push --skip-generate
        exec npx tsx watch src/index.ts
    environment:
      DATABASE_URL: postgresql://moonberry:moonberry_local_dev@db:5432/moonberry
      PORT: '4000'
      UPLOAD_DIR: /data/uploads
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    env_file:
      - /run/base44/app.env
    volumes:
      - ./apps/api:/app
      - moonberry-api-modules:/app/node_modules
      - moonberry-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      base44.project: 'Moonberry'
      base44.kind: 'api'
      base44.port: '4000'

  seed:
    build:
      context: ./apps/api
    working_dir: /app
    command: ['npx', 'tsx', 'src/seed.ts']
    environment:
      DATABASE_URL: postgresql://moonberry:moonberry_local_dev@db:5432/moonberry
      UPLOAD_DIR: /data/uploads
    env_file:
      - /run/base44/app.env
    volumes:
      - ./apps/api:/app
      - moonberry-api-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: 'no'
    labels:
      base44.project: 'Moonberry'
      base44.kind: 'worker'

  web:
    build:
      context: ./apps/web
    restart: on-failure
    working_dir: /app
    command: ['npx', 'vite', '--host', '0.0.0.0', '--port', '5173']
    environment:
      API_INTERNAL_URL: http://api:4000
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    volumes:
      - ./apps/web:/app
      - moonberry-web-modules:/app/node_modules
    ports:
      - '3000:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5173/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      base44.project: 'Moonberry'
      base44.kind: 'web'
      base44.port: '3000'

volumes:
  moonberry-db:
  moonberry-api-modules:
  moonberry-web-modules:
  moonberry-uploads:

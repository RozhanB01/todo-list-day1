 "منبع", "type": "noun", "level": "B1", "category": "General English", "example": "We used the word source in today's lesson.", "translation": "در درس امروز از واژه‌ای با معنی «منبع» استفاده کردیم.", "source": "HB Lex Original"}, {"id": "hb192", "word": "study", "meaning": "مطالعه کردن", "type": "verb", "level": "A1", "category": "General English", "example": "I try to study this skill every day.", "translation": "من سعی می‌کنم هر روز مهارت مربوط به «مطالعه کردن» را تمرین کنم.", "source": "HB Lex Original"}, {"id": "hb193", "word": "success", "meaning": "موفقیت", "type": "noun", "level": "A2", "category": "General English", "example": "We used the word success in today's lesson.", "translation": "در درس امروز از واژه‌ای با معنی «موفقیت» استفاده کردیم.", "source": "HB Lex Original"}, {"id": "hb194", "word": "suggest", "meaning": "پیشنهاد دادن", "type": "verb", "level": "B1", "category": "General English", "example": "I try to suggest this skill every day.", "translation": "من سعی می‌کنم هر روز مهارت مربوط به «پیشنهاد دادن» را تمرین کنم.", "source": "HB Lex Original"}, {"id": "hb195", "word": "understand", "meaning": "فهمیدن", "type": "verb", "level": "A1", "category": "General English", "example": "I try to understand this skill every day.", "translation": "من سعی می‌کنم هر روز مهارت مربوط به «فهمیدن» را تمرین کنم.", "source": "HB Lex Original"}, {"id": "hb196", "word": "useful", "meaning": "مفید", "type": "adjective", "level": "A2", "category": "General English", "example": "This word is useful in everyday communication.", "translation": "این واژه در ارتباط روزمره «مفید» است.", "source": "HB Lex Original"}, {"id": "hb197", "word": "vocabulary", "meaning": "واژگان", "type": "noun", "level": "A2", "category": "General English", "example": "We used the word vocabulary in today's lesson.", "translation": "در درس امروز از واژه‌ای با معنی «واژگان» استفاده کردیم.", "source": "HB Lex Original"}, {"id": "hb198", "word": "weekly", "meaning": "هفتگی", "type": "adjective", "lev window.HB_READINGS=[{"id": "r1", "title": "Why Sleep Helps Memory", "level": "B1", "minutes": 2, "text": "Sleep is an active part of learning, not simply a break from it. While we sleep, the brain reorganizes information and strengthens some of the connections created during the day. This is one reason a short review before bedtime can be useful. Good sleep does not replace practice, but it can help new vocabulary become easier to retrieve later.", "translation": "خواب بخشی فعال از یادگیری است و فقط استراحت محسوب نمی‌شود. هنگام خواب، مغز اطلاعات را دوباره سازمان‌دهی می‌کند و برخی ارتباط‌های ایجادشده در طول روز را تقویت می‌کند. به همین دلیل یک مرور کوتاه پیش از خواب می‌تواند مفید باشد. خواب خوب جای تمرین را نمی‌گیرد، اما کمک می‌کند واژگان جدید بعداً راحت‌تر به یاد آورده شوند.", "questions": [{"q": "What does the brain do during sleep?", "choices": ["It stops processing information", "It reorganizes and strengthens information", "It removes all new memories"], "answer": 1}, {"q": "What can be useful before bedtime?", "choices": ["A short review", "Learning without sleep", "Avoiding vocabulary"], "answer": 0}]}, {"id": "r2", "title": "Small Habits, Big Results", "level": "B1", "minutes": 2, "text": "Learning twenty words each day may look like a small target, but consistency changes the result. Short sessions reduce mental fatigue and make it easier to return to the material. When learners combine spaced review with active recall, they spend more time on words that are actually difficult and less time on words they already know.", "translation": "یادگیری بیست لغت در روز شاید هدف کوچکی به نظر برسد، اما تداوم نتیجه را تغییر می‌دهد. جلسه‌های کوتاه خستگی ذهنی را کاهش می‌دهند و بازگشت به مطالب را آسان‌تر می‌کنند. وقتی زبان‌آموز مرور فاصله‌دار را با بازیابی فعال ترکیب می‌کند، زمان بیشتری صرف لغات واقعاً دشوار و زمان کمتری صرف لغات آشنا می‌شود.", "questions": [{"q": "Why are short sessions helpful?", "choices": ["They reduce mental fatigue", "They remove the need for review", "They make every word easy"], "answer": 0}, {"q": "What does active recall help learners focus on?", "choices": ["Only easy words", "Difficult words", "No vocabulary"], "answer": 1}]}, {"id": "r3", "title": "Technology and Focus", "level": "B2", "minutes": 3, "text": "Digital tools can support learning when they are designed around attention rather than constant interruption. Notifications, animations, and endless feeds can compete with the task a learner is trying to complete. A focused learning app should make the next action obvious, keep sessions short, and give useful feedback without creating unnecessary noise.", "translation": "ابزارهای دیجیتال زمانی می‌توانند از یادگیری حمایت کنند که بر پایه توجه طراحی شده باشند، نه وقفه‌های دائمی. اعلان‌ها، انیمیشن‌ها و فیدهای بی‌پایان می‌توانند با کاری که زبان‌آموز قصد انجامش را دارد رقابت کنند. یک اپ یادگیری متمرکز باید قدم بعدی را روشن کند، جلسه‌ها را کوتاه نگه دارد و بدون ایجاد شلوغی بازخورد مفید بدهد.", "questions": [{"q": "What can compete with a learner's task?", "choices": ["Constant interruptions", "Clear feedback", "Short sessions"], "answer": 0}, {"q": "What should a focused learning app do?", "choices": ["Create more noise", "Make the next action clear", "Hide progress"], "answer": 1}]}, {"id": "r4", "title": "Clinical Communication", "level": "B2", "minutes": 3, "text": "Clear communication is essential in clinical care. A medical professional must listen carefully, use precise language, and check whether the patient has understood important instructions. Technical vocabulary is necessary, but it should not prevent the patient from understanding what is happening. Good communication can improve trust, safety, and adherence to treatment.", "translation": "ارتباط روشن در مراقبت بالینی ضروری است. متخصص پزشکی باید با دقت گوش دهد، از زبان دقیق استفاده کند و بررسی کند که آیا بیمار دستورهای مهم را فهمیده است یا نه. واژگان تخصصی لازم‌اند، اما نباید مانع فهم بیمار شوند. ارتباط خوب می‌تواند اعتماد، ایمنی و پایبندی به درمان را بهبود دهد.", "questions": [{"q": "What should a medical professional check?", "choices": ["Whether the patient understood instructions", "Whether the patient knows coding", "Whether the room is silent"], "answer": 0}, {"q": "What can good communication improve?", "choices": ["Only vocabulary", "Trust and safety", "Screen brightness"], "answer": 1}]}, {"id": "r5", "title": "Building Reliable Software", "level": "B2", "minutes": 3, "text": "Reliable software is usually the result of many small engineering decisions. Developers test assumptions, handle errors, protect user data, and monitor systems after deployment. A feature is not complete simply because it works once. It should also behave predictably when the network is slow, input is unexpected, or many users arrive at the same time.", "translation": "نرم‌افزار قابل‌اعتماد معمولاً نتیجه تعداد زیادی تصمیم کوچک مهندسی است. توسعه‌دهندگان فرض‌ها را آزمایش می‌کنند، خطاها را مدیریت می‌کنند، از داده‌های کاربر محافظت می‌کنند و سیستم را پس از استقرار پایش می‌کنند. یک قابلیت فقط به این دلیل که یک‌بار کار کرده کامل نیست؛ باید در شبکه کند، ورودی غیرمنتظره و حضور هم‌زمان کاربران زیاد نیز قابل پیش‌بینی باشد.", "questions": [{"q": "When is a feature truly reliable?", "choices": ["When it works once", "When it behaves predictably in difficult conditions", "When it has many animations"], "answer": 1}, {"q": "What should developers protect?", "choices": ["User data", "Only icons", "Only test files"], "answer": 0}]}, {"id": "r6", "title": "The Value of Review", "level": "B1", "minutes": 2, "text": "Forgetting is a normal part of learning. The goal of review is not to prevent every mistake, but to bring information back at useful intervals. A word that feels difficult today may become easy after several successful recalls. Spaced repetition works best when learners answer honestly instead of marking a word as known just to finish the session faster.", "translation": "فراموش کردن بخش طبیعی یادگیری است. هدف مرور این نیست که جلوی هر اشتباه را بگیرد، بلکه اطلاعات را در فاصله‌های زمانی مناسب دوباره فعال کند. لغتی که امروز دشوار به نظر می‌رسد ممکن است پس از چند بازیابی موفق آسان شود. مرور فاصله‌دار زمانی بهترین نتیجه را می‌دهد که زبان‌آموز صادقانه پاسخ دهد و فقط برای تمام کردن سریع‌تر جلسه، لغت را بلد علامت نزند.", "questions": [{"q": "What is the goal of review?", "choices": ["To avoid every mistake", "To reactivate information at useful intervals", "To finish as fast as possible"], "answer": 1}, {"q": "How should learners rate their knowledge?", "choices": ["Honestly", "Randomly", "Always as known"], "answer": 0}]}];
</script><script>(()=>{
'use strict';
const INTERVALS=[1,3,7,14,21,30,45,90];
const STORE='hb-lex-final-v1';
const WORDS=window.HB_WORDS||[];
const READINGS=window.HB_READINGS||[];

const PDFWORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs';
const STOP=new Set(('the a an and or but if then than with without from into onto for of to in on at by as is are was were be been being this that these those it its they them their he she his her you your we our i my me do does did have has had can could may might will would should must not no yes very more most less least much many some any each every all both either neither also just only such other another same different about above below before after during between through because while where when what which who whom whose how why here there today tomorrow yesterday patient patients study studies using use used new data system results result team word words learning learner learners medical clinical software english language vocabulary review important').split(/\s+/));
const ICONS={home:'⌂',decks:'▦',stats:'▥',profile:'◉'};
let deferredInstall=null, reminderTimer=null;
let view={name:'home'};
let session=null;
let exam=null;
let pdfDraft=null;
let state=loadState();

function blankState(){return {version:2,progress:{},history:[],daily:{date:dayKey(),newLearned:0},favorites:[],customDecks:[],examHistory:[],readingHistory:[],reminder:{enabled:true,time:'20:00'},settings:{newPerDay:20,defaultDeck:'همه'},profile:{name:'Rozhan'},streak:{count:0,lastDate:null},createdAt:new Date().toISOString()}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');return normalizeState(s||blankState())}catch{return blankState()}}
function normalizeState(s){const b=blankState();const n={...b,...s,settings:{...b.settings,...(s.settings||{})},reminder:{...b.reminder,...(s.reminder||{})},profile:{...b.profile,...(s.profile||{})},streak:{...b.streak,...(s.streak||{})}};if(!Array.isArray(n.readingHistory))n.readingHistory=[];if(n.daily?.date!==dayKey())n.daily={date:dayKey(),newLearned:0};return n}
function save(){localStorage.setItem(STORE,JSON.stringify(state));scheduleReminder()}
function dayKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`}
function addDaysISO(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d.toISOString()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400)}
function allWords(){return [...WORDS,...state.customDecks.flatMap(d=>d.cards||[])]}
function byId(id){return allWords().find(w=>w.id===id)}
function categories(){const built=[...new Set(WORDS.map(w=>w.category))].map(name=>({id:name,name,count:WORDS.filter(w=>w.category===name).length,custom:false}));const custom=state.customDecks.map(d=>({id:d.id,name:d.name,count:(d.cards||[]).length,custom:true}));return [...built,...custom]}
function wordsForDeck(id){const c=state.customDecks.find(d=>d.id===id);return c?c.cards:WORDS.filter(w=>w.category===id)}
function progressOf(id){return state.progress[id]||{stage:0,dueAt:null,firstSeenAt:null,lastReviewedAt:null,correct:0,wrong:0,difficult:false,mastered:false}}
function dueWords(){const now=Date.now();return allWords().filter(w=>{const p=progressOf(w.id);return p.firstSeenAt&&!p.mastered&&p.dueAt&&new Date(p.dueAt).getTime()<=now})}
function unseenWords(deck='همه'){let pool=deck==='همه'?allWords():wordsForDeck(deck);return pool.filter(w=>!progressOf(w.id).firstSeenAt)}
function dailyQueue(deck=state.settings.defaultDeck){const due=dueWords();const remaining=Math.max(0,state.settings.newPerDay-(state.daily.newLearned||0));const fresh=unseenWords(deck).slice(0,remaining);const seen=new Set();return [...due,...fresh].filter(w=>w&&!seen.has(w.id)&&(seen.add(w.id),true))}
function difficultWords(){return allWords().filter(w=>progressOf(w.id).difficult)}
function learnedCount(){return Object.values(state.progress).filter(p=>p.firstSeenAt).length}
function masteredCount(){return Object.values(state.progress).filter(p=>p.mastered).length}
function retention(){if(!state.history.length)return 0;return Math.round(state.history.filter(h=>h.correct).length/state.history.length*100)}
function markStudyDay(){const today=dayKey();if(state.streak.lastDate===today)return;const y=new Date();y.setDate(y.getDate()-1);state.streak.count=state.streak.lastDate===dayKey(y)?state.streak.count+1:1;state.streak.lastDate=today}
function recordAnswer(id,correct){const p=progressOf(id);const first=!p.firstSeenAt;let next;if(correct){const wait=INTERVALS[Math.min(p.stage,INTERVALS.length-1)];const newStage=p.stage+1;next={...p,stage:newStage,dueAt:newStage>=INTERVALS.length?null:addDaysISO(wait),firstSeenAt:p.firstSeenAt||new Date().toISOString(),lastReviewedAt:new Date().toISOString(),correct:(p.correct||0)+1,mastered:newStage>=INTERVALS.length,difficult:(p.wrong||0)>((p.correct||0)+1)};}else{next={...p,stage:0,dueAt:addDaysISO(1),firstSeenAt:p.firstSeenAt||new Date().toISOString(),lastReviewedAt:new Date().toISOString(),wrong:(p.wrong||0)+1,mastered:false,difficult:(p.wrong||0)+1>=2};}
state.progress[id]=next;state.history.push({wordId:id,correct,at:new Date().toISOString(),category:byId(id)?.category||'Custom'});if(first)state.daily.newLearned=Math.min(state.settings.newPerDay,(state.daily.newLearned||0)+1);markStudyDay();save()}

function weeklyWords(){const cutoff=Date.now()-7*86400000;const ids=[...new Set(state.history.filter(h=>new Date(h.at).getTime()>=cutoff).map(h=>h.wordId))];let ws=ids.map(byId).filter(Boolean);if(ws.length<5)ws=allWords().filter(w=>progressOf(w.id).firstSeenAt).slice(-20);if(ws.length<5)ws=WORDS.slice(0,20);return ws}
function weeklyStatus(){const last=state.examHistory.filter(e=>e.mode==='weekly').sort((a,b)=>new Date(b.at)-new Date(a.at))[0];if(!last){const first=state.history[0]?.at;if(!first)return 'پس از ۷ روز مطالعه';const days=Math.floor((Date.now()-new Date(first))/86400000);return days>=7?'آزمون آماده است':`${fa(7-days)} روز دیگر`;}const days=Math.floor((Date.now()-new Date(last.at))/86400000);return days>=7?'آزمون جدید آماده است':`${fa(7-days)} روز دیگر`;}
function buildExam(ws,mode,label){const pool=shuffle(ws).slice(0,Math.min(20,ws.length));const qs=pool.map((w,i)=>{const others=shuffle(allWords().filter(x=>x.id!==w.id));if(i%3===1){const choices=shuffle([w.word,...others.slice(0,3).map(x=>x.word)]);return{type:'جمله',q:`Which word best fits this meaning: «${w.meaning}»?`,choices,answer:choices.indexOf(w.word)}}if(i%3===2){const choices=shuffle([w.meaning,...others.slice(0,3).map(x=>x.meaning)]);return{type:'معنی',q:`What is the best Persian meaning of “${w.word}”?`,choices,answer:choices.indexOf(w.meaning)}}const choices=shuffle([w.word,...others.slice(0,3).map(x=>x.word)]);return{type:'بازیابی',q:`کدام واژه یعنی «${w.meaning}»؟`,choices,answer:choices.indexOf(w.word)}});return{mode,label,questions:qs,answers:{},submitted:false}}
function renderExam(){if(!exam)return `<main class="shell">${status()}<div class="page">${back('home')}<div class="empty">آزمونی ساخته نشده.</div></div></main>`;const answered=Object.keys(exam.answers).length,score=exam.questions.reduce((s,q,i)=>s+(exam.answers[i]===q.answer?1:0),0);return `<main class="shell">${status()}<div class="page">${back(exam.mode==='weekly'?'home':'decks')}${title(exam.label,exam.mode==='weekly'?'از لغات ۷ روز گذشته':'جمع‌بندی دسته لغات')}<section class="card notice"><b>🏆 ${exam.mode==='weekly'?'Weekly Review':'Deck Final Review'}</b><p class="muted">معنی، بازیابی و انتخاب واژه</p></section><div class="progress" style="margin:13px 0"><i style="width:${exam.questions.length?answered/exam.questions.length*100:0}%"></i></div>${exam.questions.map((q,i)=>`<section class="card question"><small class="pill">${q.type}</small><b>${i+1}. ${esc(q.q)}</b>${q.choices.map((c,j)=>{let cls=exam.answers[i]===j?'chosen':'';if(exam.submitted&&j===q.answer)cls+=' correct';if(exam.submitted&&exam.answers[i]===j&&j!==q.answer)cls+=' bad';return`<button ${exam.submitted?'disabled':''} class="${cls}" onclick="App.examAnswer(${i},${j})">${esc(c)}</button>`}).join('')}</section>`).join('')}${!exam.submitted?`<button class="primary" ${answered!==exam.questions.length?'disabled':''} onclick="App.submitExam()">ثبت آزمون</button>`:`<section class="card score"><div class="big">${score/exam.questions.length>=.8?'🏆':'✅'}</div><h2>${fa(score)}/${fa(exam.questions.length)}</h2><p>${score/exam.questions.length>=.8?'عالی! این مجموعه خوب تثبیت شده.':'لغات اشتباه را دوباره مرور کن.'}</p></section>`}</div></main>`}
function renderPdf(){const info=pdfDraft;return `<main class="shell">${status()}<div class="page">${back('decks')}${title('ساخت دسته از PDF','استخراج واقعی متن PDF روی دستگاه')}<section class="card upload"><div class="big">📄</div><h3>${info?.fileName?esc(info.fileName):'فایل PDF خودت را انتخاب کن'}</h3><p class="muted">جزوه، مقاله یا فایل شخصی؛ حداکثر ۶۰ صفحه پردازش می‌شود.</p><label class="primary filebtn">انتخاب PDF<input id="pdfFile" type="file" accept="application/pdf" onchange="App.pdfSelected(this.files[0])"></label></section><div id="pdfLoader" class="loader ${info?.loading?'show':''}"><div class="spinner"></div><p>در حال خواندن PDF…</p></div>${info?.error?`<section class="card notice"><b>خطا</b><p>${esc(info.error)}</p></section>`:''}${info?.candidates?.length?`<section class="form"><label>نام دسته<input id="pdfDeckName" value="${escAttr(info.deckName||'')}" placeholder="مثلاً Internal Medicine – Week 1" oninput="App.pdfName(this.value)"></label><p class="helper">لغاتی که در بانک داخلی HB Lex باشند، معنی فارسی آماده دارند. برای واژه‌های دیگر معنی را قبل از ذخیره ویرایش کن.</p><section class="card" style="padding:0 13px">${info.candidates.map((c,i)=>`<div class="candidate"><input type="checkbox" ${c.keep?'checked':''} onchange="App.pdfKeep(${i},this.checked)"><div class="fields"><span class="word">${esc(c.word)}</span><input value="${escAttr(c.meaning)}" oninput="App.pdfMeaning(${i},this.value)" placeholder="معنی فارسی"><small class="muted" dir="ltr">${esc(c.example||'')}</small></div></div>`).join('')}</section><button class="primary" onclick="App.savePdfDeck()">✨ ساخت دسته فلش‌کارت</button></section>`:''}<section class="card notice"><b>504 و 1100</b><p class="muted">اگر نسخه قانونی/شخصی PDF این منابع را داری، همین‌جا وارد کن. متن کامل کتاب‌ها به‌صورت پیش‌فرض در اپ کپی نشده است.</p></section></div></main>`}
function renderReminders(){return `<main class="shell">${status()}<div class="page">${back('profile')}${title('یادآوری روزانه','برای مرور و لغات جدید')}<section class="card reminder"><div class="toggleline"><div><b>اعلان روزانه 🔔</b><p class="muted">یادآوری مرور + لغات جدید</p></div><button class="toggle ${state.reminder.enabled?'on':''}" onclick="App.toggleReminder()"><i></i></button></div><label class="form">ساعت یادآوری<input type="time" value="${state.reminder.time}" onchange="App.reminderTime(this.value)"></label><button class="primary" onclick="App.enableNotifications()">اجازه اعلان در موبایل</button><button class="secondary" onclick="App.testNotification()">ارسال اعلان آزمایشی</button><p class="helper">HB Lex از Web Notifications و Periodic Background Sync در مرورگرهای پشتیبانی‌شده استفاده می‌کند. روی بعضی نسخه‌های iOS/Android، هشدار تضمینی در حالت کاملاً بسته نیاز به Push Server یا نسخه Native دارد.</p></section><section class="lockscreen"><div>🔒</div><h1>${state.reminder.time}</h1><div class="notif"><b>HB Lex • زمان یادگیری لغت!</b><p>مرورهای امروز و ${fa(state.settings.newPerDay)} لغت جدید منتظر توست.</p></div></section></div></main>`}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function last7Counts(){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);out.push({label:['ی','د','س','چ','پ','ج','ش'][d.getDay()]||'•',count:state.history.filter(h=>dayKey(new Date(h.at))===k).length})}return out}
function escAttr(s=''){return esc(s).replace(/`/g,'&#96;')}
function escJs(s=''){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function bindAfterRender(){}

async function registerSW(){if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js')}catch{}}}
function scheduleReminder(){clearTimeout(reminderTimer);if(!state.reminder.enabled)return;const [h,m]=state.reminder.time.split(':').map(Number);const now=new Date(),next=new Date();next.setHours(h,m,0,0);if(next<=now)next.setDate(next.getDate()+1);const ms=next-now;if(ms<2147483647)reminderTimer=setTimeout(()=>{showNotification('HB Lex • زمان مرور لغات 🔔',`مرورهای امروز و ${state.settings.newPerDay} لغت جدید منتظر توست.`);scheduleReminder()},ms)}
async function showNotification(title,body){if(Notification.permission!=='granted')return;try{const reg=await navigator.serviceWorker.ready;if(reg?.active)reg.active.postMessage({type:'SHOW_REMINDER',body});else new Notification(title,{body,icon:'./hb-lex-mark.svg'})}catch{new Notification(title,{body})}}

window.App={
 go,
 studyDaily(){const q=dailyQueue();if(!q.length)toast('امروز لغت جدید/مرور سررسید نداری؛ می‌توانی یک دسته را تمرین کنی.');startStudy(q)},
 studyDue(){startStudy(dueWords())},studyDifficult(){startStudy(difficultWords())},studyDeck(id){let ws=wordsForDeck(id),due=ws.filter(w=>progressOf(w.id).firstSeenAt&&!progressOf(w.id).mastered&&(!progressOf(w.id).dueAt||new Date(progressOf(w.id).dueAt)<=new Date()));let fresh=ws.filter(w=>!progressOf(w.id).firstSeenAt).slice(0,state.settings.newPerDay);startStudy([...due,...fresh].length?[...due,...fresh]:ws.slice(0,20))},startSingle(id){startStudy([byId(id)])},
 reveal(){session.revealed=true;render()},answer(correct){const w=session.words[session.index];recordAnswer(w.id,correct);session.index++;session.revealed=false;render()},favorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()},speak,
 filterDecks(v){document.querySelectorAll('#deckGrid .deck').forEach(el=>el.style.display=el.dataset.name.includes(v.toLowerCase())?'':'none')},showCopyright(){toast('504 و 1100: فایل شخصی خودت را از بخش PDF وارد کن.')},
 openExam(mode,id){const ws=mode==='weekly'?weeklyWords():wordsForDeck(id);exam=buildExam(ws,mode,mode==='weekly'?'آزمون هفتگی':`آزمون ${id}`);view={name:'exam'};render()},examAnswer(i,j){if(exam?.submitted)return;exam.answers[i]=j;render()},submitExam(){if(!exam||Object.keys(exam.answers).length!==exam.questions.length)return;exam.submitted=true;const score=exam.questions.reduce((s,q,i)=>s+(exam.answers[i]===q.answer?1:0),0);state.examHistory.push({mode:exam.mode,label:exam.label,score,total:exam.questions.length,at:new Date().toISOString()});save();render()},
 speakReading(){const r=READINGS.find(x=>x.id===session.id);speak(r.text,session.rate)},setRate(v){session.rate=Number(v)},toggleTranslation(){session.showTranslation=!session.showTranslation;render()},readAnswer(i,j){session.answers[i]=j;render()},
 async pdfSelected(file){if(!file)return;if(file.type!=='application/pdf')return toast('فقط فایل PDF انتخاب کن.');pdfDraft={fileName:file.name,loading:true,candidates:[],deckName:file.name.replace(/\.pdf$/i,''),error:null};render();try{const pdfjs=await import(PDFJS);pdfjs.GlobalWorkerOptions.workerSrc=PDFWORKER;const buf=await file.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;let text='';for(let p=1;p<=Math.min(pdf.numPages,60);p++){const page=await pdf.getPage(p);const content=await page.getTextContent();text+=' '+content.items.map(x=>x.str).join(' ')}const candidates=extractCandidates(text);pdfDraft={...pdfDraft,loading:false,candidates};if(!candidates.length)pdfDraft.error='واژه انگلیسی کافی در این PDF پیدا نشد.';render()}catch(e){pdfDraft={...pdfDraft,loading:false,error:'خواندن PDF انجام نشد. اگر فایل اسکن‌شده تصویری است، ابتدا OCR لازم دارد.'};render()}},pdfName(v){if(pdfDraft)pdfDraft.deckName=v},pdfKeep(i,v){pdfDraft.candidates[i].keep=v},pdfMeaning(i,v){pdfDraft.candidates[i].meaning=v},savePdfDeck(){if(!pdfDraft?.deckName?.trim())return toast('برای دسته یک نام بنویس.');const chosen=pdfDraft.candidates.filter(c=>c.keep).map((c,i)=>({id:`c-${Date.now()}-${i}`,word:c.word,meaning:c.meaning||'معنی ثبت نشده',type:'word',level:'—',category:pdfDraft.deckName.trim(),example:c.example||`The word ${c.word} appeared in the imported PDF.`,translation:c.translation||'—',source:pdfDraft.fileName}));if(!chosen.length)return toast('حداقل یک لغت را انتخاب کن.');const id=`deck-${Date.now()}`;state.customDecks.push({id,name:pdfDraft.deckName.trim(),createdAt:new Date().toISOString(),cards:chosen});save();pdfDraft=null;toast('دسته جدید ساخته شد ✓');go('deck',{id,label:state.customDecks.at(-1).name})},
 toggleReminder(){state.reminder.enabled=!state.reminder.enabled;save();render()},reminderTime(v){state.reminder.time=v;save();render()},async enableNotifications(){if(!('Notification'in window))return toast('این مرورگر اعلان را پشتیبانی نمی‌کند.');const p=await Notification.requestPermission();if(p==='granted'){try{const reg=await navigator.serviceWorker.ready;if('periodicSync'in reg)await reg.periodicSync.register('hb-lex-daily',{minInterval:12*60*60*1000})}catch{}scheduleReminder();toast('اعلان HB Lex فعال شد 🔔')}else toast('اجازه اعلان داده نشد.')},testNotification(){showNotification('HB Lex • اعلان آزمایشی 🔔','اگر این پیام را می‌بینی، اعلان‌ها فعال‌اند.');toast('اعلان آزمایشی ارسال شد.')},
 searchAll(v){view={name:'search',q:v};render()},
 saveManualDeck(){const name=document.getElementById('manualName')?.value.trim(),raw=document.getElementById('manualText')?.value.trim();if(!name)return toast('نام دسته را وارد کن.');if(!raw)return toast('حداقل یک لغت وارد کن.');const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);const cards=[];for(const line of lines){const p=line.split('|').map(x=>x.trim());if(!p[0])continue;cards.push({id:`m-${Date.now()}-${cards.length}`,word:p[0],meaning:p[1]||'معنی ثبت نشده',type:'word',level:'—',category:name,example:p[2]||`I am learning the word ${p[0]}.`,translation:p[3]||'—',source:'manual'})}if(!cards.length)return toast('فرمت لغات معتبر نیست.');const id=`deck-${Date.now()}`;state.customDecks.push({id,name,createdAt:new Date().toISOString(),cards});save();toast('دسته دستی ساخته شد ✓');go('deck',{id,label:name})},
 saveReadingResult(){const r=READINGS.find(x=>x.id===session?.id);if(!r)return;const score=r.questions.reduce((s,q,i)=>s+(session.answers[i]===q.answer?1:0),0);const today=dayKey();if(!state.readingHistory.some(x=>x.id===r.id&&dayKey(new Date(x.at))===today))state.readingHistory.push({id:r.id,title:r.title,score,total:r.questions.length,at:new Date().toISOString()});save();toast('نتیجه Reading ثبت شد ✓')},
 editName(){const x=prompt('نامی که در اپ نمایش داده شود:',state.profile.name||'Rozhan');if(x&&x.trim()){state.profile.name=x.trim().slice(0,30);save();render()}},
 async shareApp(){const data={title:'HB Lex',text:'HB Lex — Learn. Review. Remember.',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);toast('لینک کپی شد ✓')}}catch{}},
 editDailyGoal(){const x=prompt('تعداد لغت جدید روزانه:',state.settings.newPerDay);const n=Number(x);if(Number.isInteger(n)&&n>=5&&n<=50){state.settings.newPerDay=n;save();render()}},
 exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hb-lex-backup-${dayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},async importBackup(file){if(!file)return;try{const s=JSON.parse(await file.text());state=normalizeState(s);save();toast('بکاپ بازیابی شد ✓');render()}catch{toast('فایل بکاپ معتبر نیست.')}},resetConfirm(){if(confirm('همه پیشرفت محلی HB Lex پاک شود؟ این کار قابل بازگشت نیست.')){localStorage.removeItem(STORE);state=blankState();save();render()}},
 async install(){if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()}else toast('در مرورگر: Add to Home Screen / Install App را بزن.')}
};

function extractCandidates(text){const clean=text.replace(/\s+/g,' ').trim();const sentences=clean.split(/(?<=[.!?])\s+/).filter(Boolean);const counts=new Map();for(const raw of clean.match(/[A-Za-z][A-Za-z'-]{3,}/g)||[]){const w=raw.toLowerCase().replace(/^[-']|[-']$/g,'');if(w.length<4||w.length>28||STOP.has(w))continue;counts.set(w,(counts.get(w)||0)+1)}const lookup=new Map(WORDS.map(w=>[w.word.toLowerCase(),w]));return [...counts.entries()].sort((a,b)=>(lookup.has(b[0])-lookup.has(a[0]))||(b[1]-a[1])).slice(0,60).map(([word,count])=>{const known=lookup.get(word);const sentence=sentences.find(s=>new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(s))||'';return{word,count,keep:true,meaning:known?.meaning||'',example:known?.example||sentence.slice(0,220),translation:known?.translation||''}})}
